<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>束搜索算法动画演示</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-soft: #eef1f7;
      --text: #1c2333;
      --muted: #667085;
      --border: #d8deea;
      --primary: #3157d5;
      --primary-text: #ffffff;
      --success: #16835b;
      --danger: #b54747;
      --series-1: #7756d9;
      --series-2: #df7a2e;
      --series-3: #248c82;
      --shadow: 0 8px 24px rgba(31, 42, 68, 0.09);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11141b;
        --surface: #1a1f2a;
        --surface-soft: #232a37;
        --text: #edf1f7;
        --muted: #a6afc0;
        --border: #343d4d;
        --primary: #8ea6ff;
        --primary-text: #111827;
        --success: #69d5aa;
        --danger: #f19797;
        --series-1: #a58aff;
        --series-2: #f1a45f;
        --series-3: #68cabe;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 38%, transparent);
      outline-offset: 2px;
    }

    .app {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 6px;
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 650;
    }

    .subtitle {
      margin-bottom: 0;
      color: var(--muted);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .button {
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    .button:hover:not(:disabled) {
      border-color: var(--primary);
    }

    .button.primary {
      border-color: var(--primary);
      background: var(--primary);
      color: var(--primary-text);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    .beam-control {
      display: grid;
      grid-template-columns: auto 110px;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--muted);
    }

    .beam-control output {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    .stagebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .phase {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 650;
    }

    .phase-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
    }

    .metrics {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .metrics strong {
      color: var(--text);
      font-weight: 650;
    }

    .workspace {
      display: grid;
      gap: 14px;
    }

    .lane {
      min-width: 0;
    }

    .lane-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
    }

    .lane-heading h2 {
      margin-bottom: 0;
      font-size: 1rem;
      font-weight: 650;
    }

    .lane-heading span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .state-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
      gap: 10px;
    }

    .state-card {
      position: relative;
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: opacity 280ms ease, transform 280ms ease, border-color 280ms ease;
      animation: enter 320ms ease both;
    }

    .state-card.kept {
      border-color: var(--success);
    }

    .state-card.pruned {
      opacity: 0.34;
      transform: scale(0.97);
      box-shadow: none;
    }

    .state-card.solution {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent), var(--shadow);
    }

    .state-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .state-id {
      color: var(--text);
      font-weight: 650;
    }

    .tag {
      border-radius: 999px;
      padding: 2px 7px;
      background: var(--surface-soft);
      color: var(--muted);
      white-space: nowrap;
    }

    .tag.keep {
      color: var(--success);
    }

    .tag.drop {
      color: var(--danger);
    }

    .mini-board {
      display: grid;
      gap: 5px;
      min-height: 80px;
    }

    .branch {
      position: relative;
      display: grid;
      grid-template-columns: repeat(3, 22px);
      align-items: center;
      min-height: 18px;
      padding-left: 3px;
    }

    .branch::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 1px;
      height: 3px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--muted) 55%, transparent);
      z-index: 0;
    }

    .branch.removed::after {
      background: repeating-linear-gradient(
        90deg,
        color-mix(in srgb, var(--success) 60%, transparent) 0 5px,
        transparent 5px 9px
      );
    }

    .bird {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border: 1px solid color-mix(in srgb, currentColor 26%, transparent);
      border-radius: 50%;
      color: var(--text);
      font-size: 0.68rem;
      font-weight: 700;
    }

    .bird.c0 {
      background: color-mix(in srgb, var(--series-1) 50%, var(--surface));
    }

    .bird.c1 {
      background: color-mix(in srgb, var(--series-2) 54%, var(--surface));
    }

    .bird.c2 {
      background: color-mix(in srgb, var(--series-3) 52%, var(--surface));
    }

    .scoreline {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.78rem;
      font-variant-numeric: tabular-nums;
    }

    .down-arrow {
      display: grid;
      place-items: center;
      min-height: 30px;
      color: var(--muted);
      font-size: 1.35rem;
    }

    .empty-lane {
      display: grid;
      min-height: 126px;
      place-items: center;
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }

    .footerline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 16px;
      color: var(--muted);
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .swatch.c0 { background: var(--series-1); }
    .swatch.c1 { background: var(--series-2); }
    .swatch.c2 { background: var(--series-3); }

    #statusText {
      color: var(--text);
      font-weight: 600;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    @media (max-width: 760px) {
      .app {
        padding: 16px;
      }

      .topbar {
        display: grid;
      }

      .controls {
        justify-content: flex-start;
      }

      .beam-control {
        grid-template-columns: auto minmax(90px, 1fr);
        flex: 1 1 180px;
      }

      .state-grid {
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      }
    }

    @media (max-width: 430px) {
      .controls .button {
        flex: 1 1 120px;
      }

      .state-grid {
        grid-template-columns: 1fr 1fr;
      }

      .state-card {
        padding: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="beamSearchDemo">
    <div class="topbar">
      <div>
        <h1>束搜索算法动画</h1>
        <p class="subtitle">每层展开所有候选，按评分排序，只保留束宽以内的状态。</p>
      </div>
      <div class="controls" aria-label="动画控制">
        <button class="button primary" id="playButton" type="button">开始播放</button>
        <button class="button" id="stepButton" type="button">下一步</button>
        <label class="beam-control" for="beamWidth">
          <span>束宽 <output id="beamOutput">3</output></span>
          <input id="beamWidth" type="range" min="1" max="4" value="3" step="1">
        </label>
      </div>
    </div>

    <section class="stagebar" aria-live="polite">
      <div class="phase">
        <span class="phase-dot" aria-hidden="true"></span>
        <span id="phaseLabel">当前束</span>
      </div>
      <div class="metrics">
        <span>深度 <strong id="depthValue">0</strong></span>
        <span>当前状态 <strong id="beamCount">1</strong></span>
        <span>候选状态 <strong id="candidateCount">0</strong></span>
        <span>已访问 <strong id="visitedCount">1</strong></span>
      </div>
    </section>

    <div class="workspace">
      <section class="lane" aria-labelledby="currentHeading">
        <div class="lane-heading">
          <h2 id="currentHeading">当前束</h2>
          <span id="currentCaption">本层允许继续展开的状态</span>
        </div>
        <div class="state-grid" id="currentStates"></div>
      </section>

      <div class="down-arrow" aria-hidden="true">↓</div>

      <section class="lane" aria-labelledby="candidateHeading">
        <div class="lane-heading">
          <h2 id="candidateHeading">下一层候选</h2>
          <span id="candidateCaption">等待展开</span>
        </div>
        <div id="candidateStates"></div>
      </section>
    </div>

    <div class="footerline">
      <div class="legend" aria-label="鸟类型图例">
        <span class="legend-item"><span class="swatch c0"></span>A</span>
        <span class="legend-item"><span class="swatch c1"></span>B</span>
        <span class="legend-item"><span class="swatch c2"></span>C</span>
        <span class="legend-item">虚线树枝 = 已消除</span>
      </div>
      <div id="statusText" aria-live="polite">初始状态已进入束。</div>
    </div>
  </main>

  <script>
    (() => {
      const root = document.getElementById("beamSearchDemo");
      const playButton = root.querySelector("#playButton");
      const stepButton = root.querySelector("#stepButton");
      const beamWidthInput = root.querySelector("#beamWidth");
      const beamOutput = root.querySelector("#beamOutput");
      const phaseLabel = root.querySelector("#phaseLabel");
      const depthValue = root.querySelector("#depthValue");
      const beamCount = root.querySelector("#beamCount");
      const candidateCount = root.querySelector("#candidateCount");
      const visitedCount = root.querySelector("#visitedCount");
      const currentStates = root.querySelector("#currentStates");
      const candidateStates = root.querySelector("#candidateStates");
      const candidateCaption = root.querySelector("#candidateCaption");
      const statusText = root.querySelector("#statusText");

      const CAPACITY = 3;
      const INITIAL = [[0, 1, 2], [1, 2, 0], [2, 0, 1], []];
      const LETTERS = ["A", "B", "C"];
      const PHASE_NAMES = {
        beam: "当前束",
        expanded: "展开候选",
        scored: "评分排序",
        pruned: "束宽剪枝",
        solved: "找到完整解"
      };

      let timeline = [];
      let frameIndex = 0;
      let timer = null;
      let nextNodeId = 1;

      function cloneState(state) {
        return state.map(branch => branch === null ? null : [...branch]);
      }

      function canonicalKey(state) {
        return state
          .map(branch => branch === null ? "!" : branch.join(""))
          .sort()
          .join("|");
      }

      function topRun(branch) {
        const bird = branch[branch.length - 1];
        let count = 1;
        while (count < branch.length && branch[branch.length - 1 - count] === bird) {
          count += 1;
        }
        return { bird, count };
      }

      function legalMoves(state) {
        const moves = [];
        const firstEmpty = state.findIndex(branch => Array.isArray(branch) && branch.length === 0);

        state.forEach((sourceBranch, source) => {
          if (!Array.isArray(sourceBranch) || sourceBranch.length === 0) return;
          const run = topRun(sourceBranch);
          const sourceIsUniform = run.count === sourceBranch.length;

          state.forEach((destinationBranch, destination) => {
            if (source === destination || !Array.isArray(destinationBranch)) return;
            if (destinationBranch.length >= CAPACITY) return;

            if (destinationBranch.length > 0) {
              if (destinationBranch[destinationBranch.length - 1] !== run.bird) return;
            } else if (sourceIsUniform || destination !== firstEmpty) {
              return;
            }

            const count = Math.min(run.count, CAPACITY - destinationBranch.length);
            const next = cloneState(state);
            next[source] = next[source].slice(0, -count);
            const merged = [...next[destination], ...Array(count).fill(run.bird)];
            const complete = merged.length === CAPACITY && merged.every(value => value === run.bird);
            next[destination] = complete ? null : merged;
            moves.push({ source, destination, count, complete, state: next });
          });
        });

        return moves;
      }

      function metricsFor(state) {
        let removed = 0;
        let runs = 0;
        let uniform = 0;
        let locked = 0;
        let empty = 0;

        state.forEach(branch => {
          if (branch === null) {
            removed += 1;
            return;
          }
          if (branch.length === 0) {
            empty += 1;
            return;
          }
          let branchRuns = 1;
          for (let index = 1; index < branch.length; index += 1) {
            if (branch[index] !== branch[index - 1]) branchRuns += 1;
          }
          runs += branchRuns;
          if (branchRuns === 1) uniform += branch.length * branch.length;
          if (branch.length === CAPACITY && branchRuns > 1) locked += 1;
        });

        return {
          removed,
          runs,
          uniform,
          locked,
          empty,
          rank: [removed, -runs, uniform, -locked, empty]
        };
      }

      function compareNodes(left, right) {
        for (let index = 0; index < left.metrics.rank.length; index += 1) {
          const difference = right.metrics.rank[index] - left.metrics.rank[index];
          if (difference !== 0) return difference;
        }
        return left.id - right.id;
      }

      function nodeFor(state, depth, parent, move) {
        return {
          id: nextNodeId++,
          state,
          depth,
          parentId: parent ? parent.id : null,
          move,
          metrics: metricsFor(state),
          path: parent ? [...parent.path, move] : []
        };
      }

      function buildTimeline(width) {
        nextNodeId = 1;
        const first = nodeFor(cloneState(INITIAL), 0, null, null);
        let beam = [first];
        const seen = new Set([canonicalKey(first.state)]);
        const frames = [{
          phase: "beam",
          depth: 0,
          current: [...beam],
          candidates: [],
          visited: seen.size,
          message: "初始状态已进入束。"
        }];

        for (let depth = 1; depth <= 12; depth += 1) {
          const candidates = [];
          let solution = null;

          beam.forEach(parent => {
            legalMoves(parent.state).forEach(move => {
              const key = canonicalKey(move.state);
              if (seen.has(key)) return;
              seen.add(key);
              const child = nodeFor(move.state, depth, parent, move);
              candidates.push(child);
              if (!solution && child.metrics.removed === 3) solution = child;
            });
          });

          frames.push({
            phase: "expanded",
            depth,
            current: [...beam],
            candidates: [...candidates],
            visited: seen.size,
            message: `从 ${beam.length} 个状态生成 ${candidates.length} 个未访问候选。`
          });

          const sorted = [...candidates].sort(compareNodes);
          frames.push({
            phase: "scored",
            depth,
            current: [...beam],
            candidates: sorted,
            visited: seen.size,
            message: "按消除数、连续段、同色聚集度等指标排序。"
          });

          if (solution) {
            frames.push({
              phase: "solved",
              depth,
              current: [...beam],
              candidates: sorted,
              visited: seen.size,
              solutionId: solution.id,
              message: `找到完整解：${solution.path.length} 步，消除 3 / 3 根树枝。`
            });
            break;
          }

          const survivors = sorted.slice(0, width);
          frames.push({
            phase: "pruned",
            depth,
            current: [...beam],
            candidates: sorted,
            survivorIds: new Set(survivors.map(node => node.id)),
            visited: seen.size,
            message: `仅保留排名最高的 ${survivors.length} 个状态，其余候选被剪枝。`
          });

          beam = survivors;
          frames.push({
            phase: "beam",
            depth,
            current: [...beam],
            candidates: [],
            visited: seen.size,
            message: `深度 ${depth} 的幸存状态成为新的搜索束。`
          });

          if (beam.length === 0) break;
        }

        return frames;
      }

      function renderBranch(branch) {
        if (branch === null) {
          return '<div class="branch removed" aria-label="已消除树枝"></div>';
        }
        const birds = branch.map(type =>
          `<span class="bird c${type}" aria-label="类型 ${LETTERS[type]}">${LETTERS[type]}</span>`
        ).join("");
        return `<div class="branch" aria-label="树枝：${branch.map(type => LETTERS[type]).join("、") || "空"}">${birds}</div>`;
      }

      function cardMarkup(node, frame, position, candidate) {
        const moveText = node.move
          ? `S${node.parentId} · ${node.move.source + 1}→${node.move.destination + 1}`
          : "初始";
        const isPruning = frame.phase === "pruned";
        const kept = isPruning && frame.survivorIds.has(node.id);
        const pruned = isPruning && !kept;
        const solution = frame.phase === "solved" && frame.solutionId === node.id;
        const classNames = ["state-card"];
        if (kept) classNames.push("kept");
        if (pruned) classNames.push("pruned");
        if (solution) classNames.push("solution");

        let tag = candidate ? `#${position + 1}` : `深度 ${node.depth}`;
        let tagClass = "tag";
        if (kept) {
          tag = "保留";
          tagClass += " keep";
        } else if (pruned) {
          tag = "剪枝";
          tagClass += " drop";
        } else if (solution) {
          tag = "完整解";
          tagClass += " keep";
        }

        return `
          <article class="${classNames.join(" ")}" style="animation-delay:${Math.min(position * 35, 280)}ms">
            <div class="state-head">
              <span class="state-id">S${node.id}</span>
              <span class="${tagClass}">${tag}</span>
            </div>
            <div class="mini-board">${node.state.map(renderBranch).join("")}</div>
            <div class="scoreline">
              <span>${moveText}</span>
              <span>消 ${node.metrics.removed} · 段 ${node.metrics.runs}</span>
            </div>
          </article>`;
      }

      function render() {
        const frame = timeline[frameIndex];
        phaseLabel.textContent = PHASE_NAMES[frame.phase];
        depthValue.textContent = frame.depth;
        beamCount.textContent = frame.current.length;
        candidateCount.textContent = frame.candidates.length;
        visitedCount.textContent = frame.visited;
        statusText.textContent = frame.message;

        currentStates.innerHTML = frame.current
          .map((node, index) => cardMarkup(node, frame, index, false))
          .join("");

        if (frame.candidates.length === 0) {
          candidateStates.className = "empty-lane";
          candidateStates.textContent = frame.phase === "beam"
            ? "下一步将展开当前束中的所有合法移动"
            : "没有新的候选状态";
          candidateCaption.textContent = "等待展开";
        } else {
          candidateStates.className = "state-grid";
          candidateStates.innerHTML = frame.candidates
            .map((node, index) => cardMarkup(node, frame, index, true))
            .join("");
          candidateCaption.textContent = frame.phase === "pruned"
            ? `保留前 ${Math.min(Number(beamWidthInput.value), frame.candidates.length)} 个`
            : frame.phase === "solved"
              ? "搜索终止"
              : "每个候选来自一次合法移动";
        }

        const atEnd = frameIndex === timeline.length - 1;
        stepButton.disabled = atEnd;
        if (atEnd) {
          stopPlayback();
          playButton.textContent = "重新播放";
        } else if (!timer) {
          playButton.textContent = frameIndex === 0 ? "开始播放" : "继续播放";
        }
      }

      function advance() {
        if (frameIndex < timeline.length - 1) {
          frameIndex += 1;
          render();
        }
      }

      function startPlayback() {
        if (frameIndex === timeline.length - 1) frameIndex = 0;
        if (timer) return;
        playButton.textContent = "暂停";
        timer = window.setInterval(() => {
          if (frameIndex >= timeline.length - 1) {
            stopPlayback();
            render();
            return;
          }
          advance();
        }, 1050);
      }

      function stopPlayback() {
        if (timer) window.clearInterval(timer);
        timer = null;
      }

      function rebuild() {
        stopPlayback();
        const width = Number(beamWidthInput.value);
        beamOutput.value = width;
        beamOutput.textContent = width;
        timeline = buildTimeline(width);
        frameIndex = 0;
        render();
      }

      playButton.addEventListener("click", () => {
        if (timer) {
          stopPlayback();
          render();
        } else {
          startPlayback();
        }
      });

      stepButton.addEventListener("click", () => {
        stopPlayback();
        advance();
      });

      beamWidthInput.addEventListener("input", rebuild);
      rebuild();
    })();
  </script>
</body>
</html>
